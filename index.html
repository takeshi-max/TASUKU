<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>3D Race Game - Generated Car & Circuit</title>
  <style>
    body { margin: 0; overflow: hidden; background: #000; font-family: sans-serif; }
    #ui {
      position: absolute; top: 15px; left: 15px; color: white;
      text-shadow: 2px 2px 4px black; pointer-events: none; z-index: 10;
    }
    .speed-badge { font-size: 32px; font-weight: bold; color: #38bdf8; }
    .controls {
      position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 15px; z-index: 10;
    }
    .btn {
      width: 70px; height: 70px; font-size: 24px; font-weight: bold;
      background: rgba(255, 255, 255, 0.25); color: white; border: 2px solid rgba(255, 255, 255, 0.8);
      border-radius: 50%; backdrop-filter: blur(8px); touch-action: manipulation;
    }
    .btn:active { background: rgba(56, 189, 248, 0.8); }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="ui">
    <h2>🏎️ 3D CIRCUIT DRIVE</h2>
    <div class="speed-badge"><span id="speed">0</span> <small style="font-size: 16px;">km/h</small></div>
  </div>

  <div class="controls">
    <button class="btn" id="btnLeft">◀</button>
    <button class="btn" id="btnAccel">▲</button>
    <button class="btn" id="btnBrake">▼</button>
    <button class="btn" id="btnRight">▶</button>
  </div>

<script>
  // --- 1. シーン・カメラ・レンダラーの設定 ---
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x60a5fa); // 鮮やかな青空
  scene.fog = new THREE.FogExp2(0x60a5fa, 0.008); // 奥行きを出すフォグ

  const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  document.body.appendChild(renderer.domElement);

  // --- 2. 太陽光と照明 ---
  const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
  scene.add(ambientLight);

  const sun = new THREE.DirectionalLight(0xfffbeb, 1.2);
  sun.position.set(100, 150, 50);
  sun.castShadow = true;
  sun.shadow.mapSize.width = 2048;
  sun.shadow.mapSize.height = 2048;
  sun.shadow.camera.near = 0.5;
  sun.shadow.camera.far = 300;
  sun.shadow.camera.left = -100;
  sun.shadow.camera.right = 100;
  sun.shadow.camera.top = 100;
  sun.shadow.camera.bottom = -100;
  scene.add(sun);

  // --- 3. アスファルト道路とコース縁石 ---
  // 広大な芝生
  const grassGeo = new THREE.PlaneGeometry(1000, 1000);
  const grassMat = new THREE.MeshStandardMaterial({ color: 0x16a34a, roughness: 0.9 });
  const grass = new THREE.Mesh(grassGeo, grassMat);
  grass.rotation.x = -Math.PI / 2;
  grass.receiveShadow = true;
  scene.add(grass);

  // 幅広アスファルト道路（直線＆広場コース）
  const roadGeo = new THREE.PlaneGeometry(40, 1000);
  const roadMat = new THREE.MeshStandardMaterial({ color: 0x1f2937, roughness: 0.7 });
  const road = new THREE.Mesh(roadGeo, roadMat);
  road.rotation.x = -Math.PI / 2;
  road.position.y = 0.01;
  road.receiveShadow = true;
  scene.add(road);

  // 赤と白の縁石（ゼブラゾーン）を両脇に作成
  for (let z = -500; z < 500; z += 10) {
    const isRed = (Math.abs(z) / 10) % 2 === 0;
    const curbMat = new THREE.MeshStandardMaterial({ color: isRed ? 0xef4444 : 0xf8fafc });
    
    // 左縁石
    const curbL = new THREE.Mesh(new THREE.BoxGeometry(2, 0.3, 10), curbMat);
    curbL.position.set(-21, 0.15, z + 5);
    curbL.receiveShadow = true;
    scene.add(curbL);

    // 右縁石
    const curbR = new THREE.Mesh(new THREE.BoxGeometry(2, 0.3, 10), curbMat);
    curbR.position.set(21, 0.15, z + 5);
    curbR.receiveShadow = true;
    scene.add(curbR);
  }

  // --- 4. 完全自作のスポーツカーモデル構築 ---
  const car = new THREE.Group();

  // ① 車体下部（メインボディ - 鮮やかな赤色メタリック）
  const bodyGeo = new THREE.BoxGeometry(2.2, 0.6, 4.5);
  const bodyMat = new THREE.MeshStandardMaterial({ color: 0xdc2626, metalness: 0.7, roughness: 0.2 });
  const bodyMesh = new THREE.Mesh(bodyGeo, bodyMat);
  bodyMesh.position.y = 0.5;
  bodyMesh.castShadow = true;
  car.add(bodyMesh);

  // ② キャビン（コックピットガラス - 黒ツヤ）
  const glassGeo = new THREE.BoxGeometry(1.8, 0.55, 2.2);
  const glassMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.1, metalness: 0.9 });
  const glassMesh = new THREE.Mesh(glassGeo, glassMat);
  glassMesh.position.set(0, 1.0, -0.2);
  glassMesh.castShadow = true;
  car.add(glassMesh);

  // ③ リアウイング（GTウィング）
  const wingMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.5 });
  const wingBoard = new THREE.Mesh(new THREE.BoxGeometry(2.4, 0.1, 0.6), wingMat);
  wingBoard.position.set(0, 1.3, -2.0);
  wingBoard.castShadow = true;
  car.add(wingBoard);

  const wingPole1 = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.4, 0.2), wingMat);
  wingPole1.position.set(-0.8, 1.05, -2.0);
  car.add(wingPole1);

  const wingPole2 = wingPole1.clone();
  wingPole2.position.x = 0.8;
  car.add(wingPole2);

  // ④ ヘッドライト（発光表現）
  const lightMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8 });
  const lightL = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.15, 0.1), lightMat);
  lightL.position.set(-0.7, 0.6, 2.26);
  car.add(lightL);

  const lightR = lightL.clone();
  lightR.position.x = 0.7;
  car.add(lightR);

  // ⑤ リアルなホイール付きタイヤ（4輪）
  const wheelGeo = new THREE.CylinderGeometry(0.45, 0.45, 0.4, 24);
  const wheelMat = new THREE.MeshStandardMaterial({ color: 0x18181b, roughness: 0.8 });
  const rimGeo = new THREE.CylinderGeometry(0.25, 0.25, 0.42, 12);
  const rimMat = new THREE.MeshStandardMaterial({ color: 0xe2e8f0, metalness: 0.9, roughness: 0.1 });

  const createWheel = (x, y, z) => {
    const wheelGroup = new THREE.Group();
    const tire = new THREE.Mesh(wheelGeo, wheelMat);
    tire.rotation.z = Math.PI / 2;
    tire.castShadow = true;
    wheelGroup.add(tire);

    const rim = new THREE.Mesh(rimGeo, rimMat);
    rim.rotation.z = Math.PI / 2;
    wheelGroup.add(rim);

    wheelGroup.position.set(x, y, z);
    return wheelGroup;
  };

  car.add(createWheel(-1.2, 0.45, 1.4));  // 前左
  car.add(createWheel(1.2, 0.45, 1.4));   // 前右
  car.add(createWheel(-1.2, 0.45, -1.4)); // 後左
  car.add(createWheel(1.2, 0.45, -1.4));  // 後右

  scene.add(car);

  // --- 5. 操作・走行メカニズム ---
  let speed = 0;
  let angle = 0;
  const maxSpeed = 1.6;
  const accel = 0.02;
  const friction = 0.985;

  const keys = { up: false, down: false, left: false, right: false };

  window.addEventListener('keydown', e => {
    if (e.key === 'ArrowUp' || e.key === 'w') keys.up = true;
    if (e.key === 'ArrowDown' || e.key === 's') keys.down = true;
    if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = true;
    if (e.key === 'ArrowRight' || e.key === 'd') keys.right = true;
  });
  window.addEventListener('keyup', e => {
    if (e.key === 'ArrowUp' || e.key === 'w') keys.up = false;
    if (e.key === 'ArrowDown' || e.key === 's') keys.down = false;
    if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = false;
    if (e.key === 'ArrowRight' || e.key === 'd') keys.right = false;
  });

  const setupBtn = (id, key) => {
    const btn = document.getElementById(id);
    btn.addEventListener('touchstart', (e) => { e.preventDefault(); keys[key] = true; });
    btn.addEventListener('touchend', (e) => { e.preventDefault(); keys[key] = false; });
    btn.addEventListener('mousedown', () => keys[key] = true);
    btn.addEventListener('mouseup', () => keys[key] = false);
  };
  setupBtn('btnAccel', 'up');
  setupBtn('btnBrake', 'down');
  setupBtn('btnLeft', 'left');
  setupBtn('btnRight', 'right');

  // --- 6. アニメーションループ ---
  function animate() {
    requestAnimationFrame(animate);

    // 加速・ブレーキ
    if (keys.up) speed = Math.min(speed + accel, maxSpeed);
    else if (keys.down) speed = Math.max(speed - accel, -0.4);
    else speed *= friction;

    // ハンドル操作（速度が出ている時ほど曲がる）
    if (Math.abs(speed) > 0.01) {
      const dir = speed > 0 ? 1 : -1;
      if (keys.left) angle += 0.028 * dir;
      if (keys.right) angle -= 0.028 * dir;
    }

    car.rotation.y = angle;
    car.position.x += Math.sin(angle) * speed;
    car.position.z += Math.cos(angle) * speed;

    // 迫力のあるダイナミック・カメラワーク（斜め後ろ低めの視点）
    const cameraTargetX = car.position.x - Math.sin(angle) * 7;
    const cameraTargetZ = car.position.z - Math.cos(angle) * 7;
    
    camera.position.x += (cameraTargetX - camera.position.x) * 0.1;
    camera.position.y += ((car.position.y + 2.8) - camera.position.y) * 0.1;
    camera.position.z += (cameraTargetZ - camera.position.z) * 0.1;
    camera.lookAt(car.position.x, car.position.y + 0.8, car.position.z);

    // メーター更新
    document.getElementById('speed').innerText = Math.round(Math.abs(speed) * 170);

    renderer.render(scene, camera);
  }

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  animate();
</script>
</body>
</html>
