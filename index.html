<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quest Routine - ゲーミフィケーション習慣化アプリ</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent-color: #f59e0b;
      --accent-green: #10b981;
      --text-color: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 20px;
    }

    .app-container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* プレイヤー ステータスヘッダー */
    .status-card {
      background: linear-gradient(135deg, #1e293b 0%, #334155 100%);
      padding: 20px;
      border-radius: 16px;
      border: 2px solid #3b82f6;
      box-shadow: 0 10px 25px -5px rgba(59, 130, 246, 0.3);
      position: relative;
      overflow: hidden;
    }

    .status-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .player-level {
      font-size: 24px;
      font-weight: 800;
      color: #60a5fa;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .streak-badge {
      background: #7c2d12;
      color: #fdba74;
      border: 1px solid #f97316;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: bold;
    }

    /* XPバー */
    .xp-container {
      margin-top: 10px;
    }
    .xp-label {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 4px;
    }
    .xp-bar-bg {
      background: #0f172a;
      height: 12px;
      border-radius: 6px;
      overflow: hidden;
      border: 1px solid #475569;
    }
    .xp-bar-fill {
      background: linear-gradient(90deg, #3b82f6, #60a5fa);
      height: 100%;
      width: 0%;
      transition: width 0.4s ease;
    }

    /* 新規クエスト入力エリア */
    .add-quest-box {
      display: flex;
      gap: 10px;
    }
    .add-quest-box input {
      flex: 1;
      background: var(--card-bg);
      border: 1px solid #475569;
      padding: 12px 16px;
      border-radius: 12px;
      color: var(--text-color);
      font-size: 15px;
      outline: none;
    }
    .add-quest-box input:focus {
      border-color: #3b82f6;
    }
    .add-btn {
      background: #2563eb;
      color: white;
      border: none;
      padding: 0 18px;
      border-radius: 12px;
      font-weight: bold;
      cursor: pointer;
      font-size: 20px;
      transition: transform 0.1s, background-color 0.2s;
    }
    .add-btn:active {
      transform: scale(0.95);
      background: #1d4ed8;
    }

    /* クエスト一覧 */
    .section-title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .quest-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .quest-card {
      background: var(--card-bg);
      padding: 16px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border: 1px solid #334155;
      transition: transform 0.2s, border-color 0.2s;
    }
    .quest-card:hover {
      border-color: #475569;
    }
    .quest-card.completed {
      opacity: 0.6;
      border-color: var(--accent-green);
      background: #064e3b;
    }
    .quest-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .quest-title {
      font-size: 16px;
      font-weight: 600;
    }
    .quest-title.completed-text {
      text-decoration: line-through;
    }
    .quest-reward {
      font-size: 12px;
      color: var(--accent-color);
      font-weight: bold;
    }
    .complete-btn {
      background: #10b981;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
    }
    .complete-btn:hover {
      background: #059669;
    }
    .complete-btn.done {
      background: #475569;
      cursor: default;
    }

    /* レベルアップ ポップアップ演出 */
    .levelup-popup {
      position: fixed;
      top: 30%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0);
      background: rgba(15, 23, 42, 0.95);
      border: 3px solid #f59e0b;
      padding: 30px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 0 50px rgba(245, 158, 11, 0.5);
      z-index: 100;
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .levelup-popup.show {
      transform: translate(-50%, -50%) scale(1);
    }
    .levelup-title {
      font-size: 28px;
      color: #f59e0b;
      font-weight: 900;
      margin-bottom: 10px;
    }

    /* レスポンシブ調整 */
    @media (max-width: 480px) {
      body { padding: 12px; }
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- ステータスヘッダー -->
    <div class="status-card">
      <div class="status-header">
        <div class="player-level">
          <span>🛡️ LV.<span id="level">1</span></span>
        </div>
        <div class="streak-badge">🔥 <span id="streak">3</span> 日連続達成</div>
      </div>
      <div class="xp-container">
        <div class="xp-label">
          <span>NEXT LEVEL</span>
          <span><span id="currentXp">0</span> / <span id="maxXp">100</span> XP</span>
        </div>
        <div class="xp-bar-bg">
          <div class="xp-bar-fill" id="xpBar"></div>
        </div>
      </div>
    </div>

    <!-- クエスト追加 -->
    <div class="add-quest-box">
      <input type="text" id="questInput" placeholder="新しい習慣クエストを入力（例: 筋トレ15分）">
      <button class="add-btn" id="addBtn">＋</button>
    </div>

    <!-- クエストリスト -->
    <div>
      <div class="section-title">⚔️ 今日の習慣クエスト</div>
      <div class="quest-list" id="questList"></div>
    </div>
  </div>

  <!-- レベルアップモーダル -->
  <div class="levelup-popup" id="levelUpModal">
    <div class="levelup-title">🎉 LEVEL UP!!</div>
    <p style="margin-bottom: 15px;">素晴らしい！レベル <span id="newLevelText">2</span> に到達しました！</p>
    <button class="complete-btn" onclick="closeModal()">OK</button>
  </div>

  <script>
    // 初期データ
    let state = {
      level: 1,
      xp: 30,
      maxXp: 100,
      streak: 3,
      quests: [
        { id: 1, title: "朝のコップ1杯の水を飲む", xp: 30, completed: false },
        { id: 2, title: "10分間のウォーキング・散歩", xp: 40, completed: false },
        { id: 3, title: "読書 15分", xp: 50, completed: false }
      ]
    };

    // UI要素の取得
    const levelEl = document.getElementById('level');
    const streakEl = document.getElementById('streak');
    const currentXpEl = document.getElementById('currentXp');
    const maxXpEl = document.getElementById('maxXp');
    const xpBarEl = document.getElementById('xpBar');
    const questListEl = document.getElementById('questList');
    const questInputEl = document.getElementById('questInput');
    const addBtnEl = document.getElementById('addBtn');
    const levelUpModal = document.getElementById('levelUpModal');

    // UI更新関数
    function render() {
      levelEl.textContent = state.level;
      streakEl.textContent = state.streak;
      currentXpEl.textContent = state.xp;
      maxXpEl.textContent = state.maxXp;
      
      const xpPercent = (state.xp / state.maxXp) * 100;
      xpBarEl.style.width = `${xpPercent}%`;

      // クエストリスト描画
      questListEl.innerHTML = '';
      state.quests.forEach(quest => {
        const card = document.createElement('div');
        card.className = `quest-card ${quest.completed ? 'completed' : ''}`;
        card.innerHTML = `
          <div class="quest-info">
            <div class="quest-title ${quest.completed ? 'completed-text' : ''}">${quest.title}</div>
            <div class="quest-reward">+${quest.xp} XP</div>
          </div>
          <button class="complete-btn ${quest.completed ? 'done' : ''}" onclick="toggleQuest(${quest.id})">
            ${quest.completed ? '✓ 完了' : '撃破!'}
          </button>
        `;
        questListEl.appendChild(card);
      });
    }

    // クエスト完了（トグル）処理
    function toggleQuest(id) {
      const quest = state.quests.find(q => q.id === id);
      if (!quest) return;

      if (!quest.completed) {
        quest.completed = true;
        addXp(quest.xp);
      }
      render();
    }

    // 経験値獲得＆レベルアップ判定
    function addXp(amount) {
      state.xp += amount;
      if (state.xp >= state.maxXp) {
        state.xp -= state.maxXp;
        state.level += 1;
        state.maxXp = Math.floor(state.maxXp * 1.3); // 次のレベルまでの必要XPを増加
        showLevelUpModal();
      }
    }

    // モーダル表示
    function showLevelUpModal() {
      document.getElementById('newLevelText').textContent = state.level;
      levelUpModal.classList.add('show');
    }

    function closeModal() {
      levelUpModal.classList.remove('show');
    }

    // クエスト追加
    addBtnEl.addEventListener('click', () => {
      const text = questInputEl.value.trim();
      if (!text) return;

      const newQuest = {
        id: Date.now(),
        title: text,
        xp: Math.floor(Math.random() * 30) + 30, // 30~60のランダムXP
        completed: false
      };

      state.quests.push(newQuest);
      questInputEl.value = '';
      render();
    });

    // 初期化
    render();
  </script>
</body>
</html>
